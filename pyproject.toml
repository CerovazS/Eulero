[project]
name = "eulero"
version = "0.1.0"
description = "Plug & play complex-valued neural network building blocks for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Luca Cerovaz", email = "luca.cerovaz@paradigma.inc" },
]
keywords = ["pytorch", "complex-valued", "deep-learning", "audio", "source-separation"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5",
    "einops>=0.8.0",
    "complextorch>=1.2.0",
    "complexpytorch>=0.4",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eulero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
